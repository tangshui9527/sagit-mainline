SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer SLIMBUS_0_TX' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer SLIMBUS_0_TX' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='Speaker Speaker Switch' 1"
		cset "name='Speaker Earpiece Switch' 1"
		cset "name='Speaker Boost Switch' 1"
		cset "name='Speaker Receiver Mode Switch' 0"
	]

	DisableSequence [
		cset "name='Speaker Speaker Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackVolume "Speaker Master Playback Volume"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX1 MUX' AIF1_PB"
		cset "name='RX INT1_1 MIX1 INP0' RX0"
		cset "name='RX INT2_1 MIX1 INP0' RX1"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 INTERP' RX INT1_1 MIX1"
		cset "name='RX INT2 INTERP' RX INT2_1 MIX1"
		cset "name='Headphone Jack Switch' 1"
	]

	DisableSequence [
		cset "name='Headphone Jack Switch' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 0"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Dual Microphones (Top + Main)"

	EnableSequence [
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='AIF1_CAP Mixer SLIM TX1' 1"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='SLIM TX1 MUX' DEC1"
		cset "name='ADC MUX0' AMIC"
		cset "name='ADC MUX1' AMIC"
		cset "name='AMIC MUX0' ADC5"
		cset "name='AMIC MUX1' ADC3"
	]

	DisableSequence [
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='AIF1_CAP Mixer SLIM TX1' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
	}
}
