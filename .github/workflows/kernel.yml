name: kernel-build

on:
  push:
    paths:
      - '.github/workflows/kernel.yml'
      - 'configs/**'
      - 'patches/**'
      - 'initramfs/**'
  workflow_dispatch:
    inputs:
      tree_ref:
        description: 'ilertnost 树的 ref（默认固定 pin）'
        required: false
        default: 'ea08c09791cddbfc57c995e154c20d09738339a3'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TREE_REF: ${{ github.event.inputs.tree_ref || 'ea08c09791cddbfc57c995e154c20d09738339a3' }}
      CROSS_COMPILE: aarch64-linux-gnu-
      ARCH: arm64
    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: ccache restore
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-kernel-${{ env.TREE_REF }}
          restore-keys: ccache-kernel-${{ env.TREE_REF }}

      - name: Install toolchain (with ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            flex bison bc libssl-dev libelf-dev cpio python3-dev \
            build-essential dwarves zstd ccache
          ccache --set-config cache_dir=~/.ccache
          ccache --set-config max_size=5G
          ccache -z

      - name: Clone kernel bring-up tree (pinned)
        run: |
          git clone --depth 1 https://github.com/ilertnost/kernel_xiaomi_msm8998-mainline kernel
          cd kernel
          echo "HEAD before checkout: $(git rev-parse HEAD)"
          git fetch --depth 1 origin "$TREE_REF" && git checkout --detach FETCH_HEAD
          git rev-parse HEAD

      - name: Apply project patches (if any)
        run: |
          cd kernel
          if compgen -G "../patches/*.patch" > /dev/null; then
            for p in ../patches/*.patch; do
              echo "== applying $p"
              # tolerate git-am mail format (trailing signature) via patch(1) fallback
              if ! git apply --3way "$p" 2>/dev/null && ! git apply "$p" 2>/dev/null; then
                patch -p1 --forward -i "$p" && echo "applied via patch(1)" \
                  || echo "WARN: $p did not apply - skipping"
              fi
            done
          else
            echo "no patches"
          fi
          # Guarantee Hexagon remoteprocs (Modem MSS, Sensors SLPI, Audio ADSP) are enabled in DTS
          if ! grep -q "&mss_pil" arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dts; then
            printf '\n&mss_pil {\n\tfirmware-name = "qcom/msm8998/xiaomi/mba.mbn", "qcom/msm8998/xiaomi/modem.mbn";\n\tstatus = "okay";\n};\n\n&slpi_pas {\n\tfirmware-name = "qcom/msm8998/xiaomi/slpi_v2.mbn";\n\tstatus = "okay";\n};\n\n&adsp_pas {\n\tfirmware-name = "qcom/msm8998/xiaomi/adsp.mbn";\n\tstatus = "okay";\n};\n' >> arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dts
          fi

      - name: Configure (sagit_defconfig + mi6.fragment)
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- sagit_defconfig
          ./scripts/kconfig/merge_config.sh -m .config ../configs/mi6.fragment
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E 'CONFIG_USB_CONFIGFS_ACM|CONFIG_USB_F_ACM|CONFIG_USB_U_SERIAL|CONFIG_USB_CONFIGFS_RNDIS' .config || true

      - name: Build kernel and DTB
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cd kernel
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs
          KVER=$(make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelversion)
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=../modules modules_install
          tar -czf ../modules.tar.gz -C ../modules lib
          echo "KVER=$KVER" > ../kver.txt
          # sagit ABL expects: gzip(Image) followed by raw DTB after the gzip
          # stream (same layout as the working R6 boot.img and TWRP sagit)
          gzip -9 -c arch/arm64/boot/Image > Image.gz
          cat Image.gz arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dtb > Image.gz-dtb
          ls -la arch/arm64/boot/Image Image.gz-dtb

      - name: Get arm64 static busybox (prebuilt, no cross-compile)
        run: |
          sudo dpkg --add-architecture arm64
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe\n' | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          cd /tmp && apt-get download busybox-static:arm64
          mkdir busybox-root && dpkg -x busybox-static_*.deb busybox-root
          BB=$(find busybox-root -type f -name busybox | head -1)
          echo "busybox binary: $BB"
          file "$BB"
          mkdir -p "$GITHUB_WORKSPACE/busybox-arm64"
          cp "$BB" "$GITHUB_WORKSPACE/busybox-arm64/busybox"

      - name: Assemble initramfs cpio
        run: |
          mkdir -p initramfs-root/bin initramfs-root/sbin initramfs-root/dev initramfs-root/proc initramfs-root/sys initramfs-root/tmp initramfs-root/run initramfs-root/etc initramfs-root/sys/kernel/config initramfs-root/sys/class
          cp busybox-arm64/busybox initramfs-root/bin/busybox
          chmod +x initramfs-root/bin/busybox
          ln -sf busybox initramfs-root/bin/sh
          for cmd in sleep echo cat ls mkdir mount mknod grep sync dd reboot ifconfig telnetd udhcpd cttyhack ps kill; do
            ln -sf busybox "initramfs-root/bin/$cmd"
          done
          cp initramfs/init initramfs-root/init
          chmod +x initramfs-root/init
          if [ -d initramfs/etc ]; then
            cp -r initramfs/etc/* initramfs-root/etc/
          fi
          (cd initramfs-root && find . | cpio -o -H newc) | gzip -9 > initramfs.cpio.gz
          ls -la initramfs.cpio.gz

      - name: Pack boot.img
        run: |
          # AOSP mkbootimg.py imports its sibling `gki` package, so clone the whole repo
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg-repo \
            || git clone --depth 1 https://github.com/LineageOS/android_system_tools_mkbootimg mkbootimg-repo
          python3 mkbootimg-repo/mkbootimg.py \
            --kernel kernel/Image.gz-dtb \
            --ramdisk initramfs.cpio.gz \
            --base 0 \
            --pagesize 4096 \
            --kernel_offset 0x8000 \
            --ramdisk_offset 0x4000000 \
            --second_offset 0xf00000 \
            --tags_offset 0x100 \
            --board sagit \
            --cmdline "clk_ignore_unused console=tty1" \
            --output boot.img
          # new AOSP mkbootimg zeroes second_addr when --second is absent;
          # patch it to 0xf00000 so the header is field-for-field identical
          # to the known-good R6/TWRP sagit layout
          python3 - <<'EOF'
          import struct
          d = bytearray(open('boot.img','rb').read())
          d[28:32] = (0xf00000).to_bytes(4, 'little')
          open('boot.img','wb').write(bytes(d))
          ks,ka,rs,ra,ss,sa,ta,ps,_,_ = struct.unpack('<10I', d[8:48])
          assert (ka,ra,sa,ta,ps) == (0x8000,0x4000000,0xf00000,0x100,4096), 'header mismatch'
          print('header ok: kernel=%d@%#x ramdisk=%d@%#x tags=%#x page=%d' % (ks,ka,rs,ra,ta,ps))
          EOF
          ls -la boot.img

      - name: ccache stats
        run: ccache -s 2>/dev/null | head -8 || true

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp kernel/arch/arm64/boot/Image out/
          cp kernel/arch/arm64/boot/dts/qcom/msm8998-xiaomi-sagit.dtb out/
          cp kernel/Image.gz-dtb out/
          cp kernel/.config out/config-$(cd kernel && make -s kernelversion)
          cp initramfs.cpio.gz out/
          cp boot.img out/
          cd kernel && git rev-parse HEAD > ../out/kernel-commit.txt && cd ..
          cp busybox-arm64/busybox out/busybox-aarch64-static
          cp modules.tar.gz out/
          cp kver.txt out/
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: sagit-kernel-${{ env.TREE_REF }}
          path: out/
